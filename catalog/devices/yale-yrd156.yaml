    summary: >-
      A strict locked/unlocked subset has a candidate correspondence with the
      selected SDF property. Unknown state and method/user metadata are not
      preserved. The examined handler path requires a true migration flag;
      that state has not been established for a real YRD156.
    mapping_ids:
