name: Validate catalog

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read and validate the EdgeLoom core pin
        id: core
        shell: bash
        run: |
          commit="$(tr -d '[:space:]' < CORE_REVISION)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned EdgeLoom core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: edgeloom-oss/edgeloom
          ref: ${{ steps.core.outputs.commit }}
          path: .edgeloom-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install hash-locked validation runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-deps
          --only-binary=:all: --require-hashes -r requirements-ci.txt

      - name: Validate local catalog contracts
        run: PYTHON_BIN="$(command -v python)" ./scripts/validate-catalog.sh
