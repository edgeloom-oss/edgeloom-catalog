name: Independent record or bundle review
description: Review a stated scope against exact catalog record revisions
title: "[Review] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Review an exact catalog revision. Schema validity alone is not review.
        A verified lifecycle additionally requires a governed maintainer
        decision and stable `decision_ref`.
        Draft bundles and observations remain candidate even after a scoped
        review. Describe exactly what you checked and what remains untested.

  - type: input
    id: bundle
    attributes:
      label: Bundle ID or link (if relevant)
      placeholder: yale-yrd210-battery

  - type: input
    id: version
    attributes:
      label: Bundle version (if relevant)
      placeholder: 0.1.0

  - type: input
    id: feature
    attributes:
      label: Feature ID (if relevant)
      placeholder: battery

  - type: input
    id: mapping
    attributes:
      label: Record IDs and exact revisions reviewed
      description: Provide paths, SHA-256 digests and commit or permanent pull-request links. For a bundle, identify the constituent records covered by your review.
    validations:
      required: true

  - type: input
    id: reviewer-id
    attributes:
      label: Reviewer identifier
      description: Use the stable public actor identifier to be recorded with the review.
      placeholder: github:@reviewer
    validations:
      required: true

  - type: textarea
    id: expertise
    attributes:
      label: Relevant experience and review scope
      description: Describe the ecosystem, protocol, device, SDF, provenance, or reproducibility areas you reviewed. Do not include private personal information.
    validations:
      required: true

  - type: textarea
    id: conflicts
    attributes:
      label: Conflict-of-interest disclosure
      description: State relevant authorship, employment, funding, vendor, standards, or project relationships, or write "None known."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Evidence checked and reproduction performed
      description: List pinned sources, digest checks, locators, commands, and static inspection. State what you did not check.
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: Review findings
      description: Assess the statements within your scope, such as document applicability, implementation reasoning, observation reproducibility or mapping semantics. Identify claims you could not check.
    validations:
      required: true

  - type: dropdown
    id: recommendation
    attributes:
      label: Recommendation
      options:
        - Keep as candidate; changes required
        - Accept the stated review scope; draft bundle and observations remain candidate
        - Mapping only - accept as reviewed within the stated scope
        - Mapping only - eligible for a separate governed verified decision
        - Deprecate or replace
    validations:
      required: true

  - type: textarea
    id: limitations
    attributes:
      label: Review limitations and required follow-up
      description: Bound your conclusion and identify unresolved evidence or corrections.
    validations:
      required: true

  - type: checkboxes
    id: independence
    attributes:
      label: Review attestation
      options:
        - label: I did not author the reviewed records and have disclosed material relationships that could affect my independence.
          required: true
        - label: I reviewed the exact revision named above, not only a summary or rendered page.
          required: true
        - label: I did not execute upstream drivers, scripts, or generated commands as part of catalog validation.
          required: true
        - label: My report contains no secrets, real PINs or user codes, private telemetry, or household identifiers.
          required: true
        - label: I understand that this review does not by itself confer verified status.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
